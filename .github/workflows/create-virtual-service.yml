name: Create Virtual Service from Jira Story

on:
  workflow_dispatch:
    inputs:
      jira_ticket:
        description: 'Jira ticket number (e.g., PROJ-123)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-virtual-service:
    name: Read Jira Story → Create Virtual Service
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MCP servers
        env:
          ATLASSIAN_BASIC_AUTH: ${{ secrets.ATLASSIAN_BASIC_AUTH }}
          VIRTUALIZE_AUTH_TOKEN: ${{ secrets.VIRTUALIZE_AUTH_TOKEN }}
          VIRTUALIZE_MCP_URL: ${{ secrets.VIRTUALIZE_MCP_URL }}
        run: |
          mkdir -p "$HOME/.copilot"
          cat > "$HOME/.copilot/mcp-config.json" <<EOF
          {
            "mcpServers": {
              "jira-remote": {
                "type": "http",
                "url": "https://mcp.atlassian.com/v1/mcp",
                "headers": { "Authorization": "Basic ${ATLASSIAN_BASIC_AUTH}" },
                "env": { "ATLASSIAN_BASE_URL": "https://parasoft-demo.atlassian.net" }
              },
              "virtualize": {
                "type": "http",
                "url": "${VIRTUALIZE_MCP_URL}",
                "headers": { "Authorization": "Basic ${VIRTUALIZE_AUTH_TOKEN}" }
              }
            }
          }
          EOF

      - name: Step 1 - Read Jira story
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          ticket="${{ inputs.jira_ticket }}"
          prompt=$(printf '%s\n  %s\n\n%s' \
            "Read the following skill file in full before taking any action:" \
            ".github/skills/jira-story-virtual-service/SKILL.md" \
            "Then use the jira-remote MCP to fetch Jira ticket ${ticket} and output the full user story.")
          set +e
          output=$(copilot -p "$prompt" --yolo --no-ask-user)
          exit_code=$?
          set -e
          echo "$output"
          echo "$output" > story.txt
          if [ $exit_code -ne 0 ]; then
            echo "::error::Copilot CLI exited with code $exit_code."
            exit $exit_code
          fi

      - name: Step 2 - Create virtual service via MCP
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          prompt=$(printf '%s\n  %s\n  %s\n  %s\n  %s\n\n%s\n\n%s' \
            "Read each of the following skill files in full before taking any action:" \
            ".github/skills/virtualize-mcp-general-rules/SKILL.md" \
            ".github/skills/virtualize-correlation-matching-rules/SKILL.md" \
            ".github/skills/virtualize-inline-expressions/SKILL.md" \
            ".github/skills/virtualize-asset-validation-instructions/SKILL.md" \
            "Using the virtualize MCP, create and deploy a virtual service based on this user story:" \
            "$(cat story.txt)")
          set +e
          output=$(copilot -p "$prompt" --yolo --no-ask-user)
          exit_code=$?
          set -e
          echo "$output"
          echo "$output" > pva.txt
          if [ $exit_code -ne 0 ]; then
            echo "::error::Copilot CLI exited with code $exit_code."
            exit $exit_code
          fi

      - name: Step 3 - Verify virtual service
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          prompt=$(printf '%s\n  %s\n\n%s\n\n%s' \
            "Read the following skill file in full before taking any action:" \
            ".github/skills/virtualize-asset-validation-instructions/SKILL.md" \
            "Using the virtualize MCP, verify that the virtual service described below is deployed and responding correctly:" \
            "$(cat pva.txt)")
          set +e
          output=$(copilot -p "$prompt" --yolo --no-ask-user)
          exit_code=$?
          set -e
          echo "$output"
          if [ $exit_code -ne 0 ]; then
            echo "::error::Copilot CLI exited with code $exit_code."
            exit $exit_code
          fi
